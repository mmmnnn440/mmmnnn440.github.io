<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圣殿客服 · 超维链接 | 人工客服通道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Microsoft YaHei', sans-serif;
            background: #03010f;
        }

        /* ========= 震撼动态背景：星河漩涡 + 辉光矩阵 ========= */
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 30% 10%, #02001a, #000000);
            overflow: hidden;
        }

        /* 星云动态光晕 */
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 80%, rgba(100, 0, 255, 0.25), transparent 60%);
            filter: blur(60px);
            animation: nebulaPulse 8s infinite alternate ease-in-out;
        }

        .nebula2 {
            background: radial-gradient(circle at 20% 30%, rgba(255, 80, 40, 0.2), transparent 70%);
            filter: blur(70px);
            animation: nebulaMove 12s infinite alternate;
        }

        @keyframes nebulaPulse {
            0% { opacity: 0.4; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.2);}
        }
        @keyframes nebulaMove {
            0% { transform: translate(0px, 0px) scale(1); opacity: 0.3;}
            100% { transform: translate(3%, 5%) scale(1.3); opacity: 0.8;}
        }

        /* 动态网格 + 流光线条 */
        .grid-matrix {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(0deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(45deg) rotateZ(15deg);
            animation: gridFlow 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridFlow {
            0% { transform: rotateX(45deg) rotateZ(15deg) translateY(0px);}
            100% { transform: rotateX(45deg) rotateZ(15deg) translateY(50px);}
        }

        /* 闪耀粒子系统 canvas */
        #starCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 主界面玻璃护盾 */
        .hero-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }

        .vortex-card {
            text-align: center;
            max-width: 700px;
            width: 90%;
            background: rgba(5, 5, 25, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 70px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 30px rgba(0, 230, 230, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 40px 30px 50px;
            transition: all 0.3s ease;
            animation: cardGlow 3s infinite alternate;
        }

        @keyframes cardGlow {
            0% { box-shadow: 0 30px 50px rgba(0,0,0,0.5), 0 0 15px rgba(0, 200, 255, 0.4), inset 0 0 5px rgba(0,255,255,0.1); border-color: rgba(0, 200, 255, 0.3);}
            100% { box-shadow: 0 40px 70px rgba(0,0,0,0.8), 0 0 45px rgba(0, 230, 255, 0.7), inset 0 0 12px rgba(0,255,210,0.3); border-color: rgba(0, 255, 255, 0.9);}
        }

        /* 圣徽装饰 */
        .sigil-ring {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .sigil {
            font-size: 48px;
            filter: drop-shadow(0 0 12px cyan);
            animation: floatIcon 2s infinite alternate;
        }
        .sigil:nth-child(2) { animation-delay: 0.3s; }
        .sigil:nth-child(3) { animation-delay: 0.6s; }
        .sigil:nth-child(4) { animation-delay: 0.9s; }
        .sigil:nth-child(5) { animation-delay: 0.2s; }
        
        @keyframes floatIcon {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 5px cyan);}
            100% { transform: translateY(-8px); filter: drop-shadow(0 0 20px #0ff);}
        }

        /* 主标题 史诗感 */
        .epic-title {
            font-size: 3.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #E0F2FE, #38BDF8, #818CF8, #C084FC);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 4px;
            margin: 20px 0 10px;
            text-transform: uppercase;
            animation: titleWave 4s ease infinite, textShine 3s linear infinite;
        }

        @keyframes titleWave {
            0% { background-position: 0% 50%;}
            50% { background-position: 100% 50%;}
            100% { background-position: 0% 50%;}
        }
        @keyframes textShine {
            0% { text-shadow: 0 0 2px rgba(0,255,255,0.3);}
            100% { text-shadow: 0 0 12px rgba(0,210,255,0.8);}
        }

        .sub-celestial {
            font-size: 1.2rem;
            color: #b1e5ff;
            letter-spacing: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,255,255,0.3), transparent);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* 超维徽章 */
        .quantum-badge {
            background: rgba(0, 20, 30, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid #0ff;
            border-radius: 60px;
            padding: 12px 28px;
            width: fit-content;
            margin: 20px auto;
            font-size: 1rem;
            font-weight: bold;
            color: #7efff0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0,255,255,0.3);
            animation: badgePulse 1.8s infinite alternate;
        }
        @keyframes badgePulse {
            0% { box-shadow: 0 0 5px cyan; border-color: #0aa; background: rgba(0, 30, 40, 0.6);}
            100% { box-shadow: 0 0 25px #0ff; border-color: #0ff; background: rgba(0, 60, 70, 0.8);}
        }

        /* 震撼级按钮 — 流光闪电 */
        .btn-transcend {
            background: linear-gradient(95deg, #0a1a3a, #07122a);
            border: none;
            padding: 18px 42px;
            border-radius: 70px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            margin: 20px 0 15px;
            position: relative;
            overflow: hidden;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 18px;
            z-index: 2;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(0, 255, 255, 0.6);
        }

        .btn-transcend::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s ease;
        }

        .btn-transcend:hover::before {
            left: 100%;
        }

        .btn-transcend:hover {
            transform: scale(1.03);
            box-shadow: 0 0 35px cyan, 0 0 60px #0ff;
            border-color: #fff;
            text-shadow: 0 0 8px white;
        }

        .btn-transcend:active {
            transform: scale(0.97);
        }

        .spark-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 6px gold);
        }

        /* 小提示 */
        .tip-ethereal {
            color: #88aaff;
            font-size: 0.85rem;
            margin-top: 25px;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 6px 16px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
        }

        /* 转接动画特效全屏 */
        .portal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2), #010005);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .portal-active {
            visibility: visible;
            opacity: 1;
        }

        .loading-holo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, cyan, magenta, cyan);
            animation: spinLoad 1.2s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px cyan;
        }

        .loading-holo-inner {
            width: 150px;
            height: 150px;
            background: #03001c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 8px cyan;
        }

        @keyframes spinLoad {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }

        .portal-text {
            margin-top: 35px;
            font-size: 1.6rem;
            letter-spacing: 4px;
            background: linear-gradient(45deg, cyan, white);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="cosmic-bg">
    <div class="nebula"></div>
    <div class="nebula nebula2"></div>
    <div class="grid-matrix"></div>
</div>
<canvas id="starCanvas"></canvas>

<div class="hero-container">
    <div class="vortex-card">
        <div class="sigil-ring">
            <span class="sigil">⚡</span>
            <span class="sigil">🌀</span>
            <span class="sigil">🔮</span>
            <span class="sigil">✨</span>
            <span class="sigil">👁️</span>
        </div>

        <div class="epic-title">灵 境 枢 纽</div>
        <div class="sub-celestial">✦ 首席智识官 · 灵曜 ✦</div>

        <div class="quantum-badge">
            <span>∞</span> 至尊人工通道 · 实时共振 <span>∞</span>
        </div>

        <button class="btn-transcend" id="superConnectBtn">
            <span class="spark-icon">🔗</span> 即刻召唤 · 天启客服 <span class="spark-icon">⚡</span>
        </button>

        <div class="tip-ethereal">✦ 点击背景任意光域可关闭特效彩蛋 ✦</div>
    </div>
</div>

<!-- 转接中炫酷传送门 -->
<div id="portalLayer" class="portal-overlay">
    <div class="loading-holo">
        <div class="loading-holo-inner">🧬</div>
    </div>
    <div class="portal-text">✦ 接驳超维客服中 ✦</div>
    <div style="margin-top: 20px; color: #aaf; font-size: 14px;">高优先级链路 · 即将为您连接真人执事官</div>
</div>

<script>
    (function() {
        // ========= 1. 超震撼星辰粒子系统 (动态性能优化) =========
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let stars = [];
        let shootingStars = [];
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initStars(400);
        });
        
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2.5 + 1;
                this.alpha = Math.random() * 0.8 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.1;
                this.color = `hsl(${Math.random() * 60 + 180}, 100%, 65%)`;
                this.twinkleSpeed = 0.02 + Math.random() * 0.03;
                this.twinkleDir = Math.random() > 0.5 ? 1 : -1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
                this.alpha += this.twinkleSpeed * this.twinkleDir;
                if (this.alpha >= 0.9) this.twinkleDir = -1;
                if (this.alpha <= 0.2) this.twinkleDir = 1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha * 0.9;
                ctx.fill();
                if (this.radius > 1.5) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#0ff';
                } else {
                    ctx.shadowBlur = 0;
                }
            }
        }
        
        class ShootingStar {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.5;
                this.length = Math.random() * 80 + 40;
                this.speedX = (Math.random() - 0.5) * 8 - 4;
                this.speedY = Math.random() * 5 + 3;
                this.opacity = 0.9;
                this.age = 0;
                this.life = 80;
                this.color = `hsl(${Math.random() * 40 + 190}, 100%, 70%)`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.age++;
                this.opacity = 1 - (this.age / this.life);
                return this.age < this.life && this.x > -100 && this.x < width+100 && this.y < height+100;
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.length * (this.speedX / (Math.abs(this.speedX)+0.01)), 
                           this.y - this.length * (this.speedY / (Math.abs(this.speedY)+0.01)));
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#0ff';
                ctx.globalAlpha = this.opacity * 0.8;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI*2);
                ctx.fillStyle = 'white';
                ctx.fill();
            }
        }
        
        function initStars(count) {
            stars = [];
            for(let i=0; i<count; i++) {
                stars.push(new Star());
            }
        }
        
        function addShootingStar() {
            if (Math.random() < 0.2 && shootingStars.length < 5) {
                shootingStars.push(new ShootingStar());
            }
        }
        
        function animateStars() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
            for(let s of stars) {
                s.update();
                s.draw();
            }
            for(let i=0; i<shootingStars.length; i++) {
                const alive = shootingStars[i].update();
                shootingStars[i].draw();
                if(!alive) {
                    shootingStars.splice(i,1);
                    i--;
                }
            }
            addShootingStar();
            requestAnimationFrame(animateStars);
        }
        
        resizeCanvas();
        initStars(450);
        animateStars();
        
        // 特殊点击粒子爆炸大彩蛋 (更震撼)
        function megaBurstExplosion(x, y) {
            const particleCount = 180;
            for(let i=0; i<particleCount; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = (x || window.innerWidth/2) + 'px';
                p.style.top = (y || window.innerHeight/2) + 'px';
                p.style.width = Math.random() * 12 + 4 + 'px';
                p.style.height = p.style.width;
                p.style.background = `radial-gradient(circle, hsl(${Math.random() * 360}, 100%, 65%), cyan)`;
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                p.style.zIndex = '99999';
                p.style.boxShadow = '0 0 20px cyan';
                const angle = Math.random() * Math.PI * 2;
                const velocity = 5 + Math.random() * 12;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                let opacity = 1;
                p.style.opacity = opacity;
                document.body.appendChild(p);
                let posX = parseFloat(p.style.left);
                let posY = parseFloat(p.style.top);
                function animateParticle() {
                    posX += vx;
                    posY += vy;
                    opacity -= 0.02;
                    p.style.left = posX + 'px';
                    p.style.top = posY + 'px';
                    p.style.opacity = opacity;
                    if(opacity <= 0) {
                        p.remove();
                    } else {
                        requestAnimationFrame(animateParticle);
                    }
                }
                requestAnimationFrame(animateParticle);
            }
            // 额外屏幕震动效果
            document.body.style.transform = 'translate(3px, 2px)';
            setTimeout(() => { document.body.style.transform = ''; }, 100);
            setTimeout(() => { document.body.style.transform = 'translate(-2px, -1px)'; }, 120);
            setTimeout(() => { document.body.style.transform = ''; }, 200);
        }
        
        // 触发粒子绽放增强 (从按钮位置)
        function burstFromElement(el) {
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            megaBurstExplosion(centerX, centerY);
        }
        
        // ========= 2. 核心转接逻辑 震撼跳转 =========
        const connectBtn = document.getElementById('superConnectBtn');
        const portalDiv = document.getElementById('portalLayer');
        let isConnecting = false;
        
        // 转接跳转链接 (保留原始风格但更震撼的客服地址)
        const TARGET_URL = 'http://192.168.88.100/app/2aad89dd-bc80-4bce-9b04-5d7b1bd2a6dc/workflow';
        
        function showPortalAndRedirect() {
            if(isConnecting) return;
            isConnecting = true;
            
            // 1. 炫酷粒子风暴
            burstFromElement(connectBtn);
            // 额外多重粒子爆炸
            setTimeout(() => { megaBurstExplosion(); }, 100);
            setTimeout(() => { megaBurstExplosion(); }, 300);
            
            // 按钮文字变幻
            const originalText = connectBtn.innerHTML;
            connectBtn.innerHTML = `<span class="spark-icon">🌀</span> 链接高维 ... <span class="spark-icon">✨</span>`;
            connectBtn.disabled = true;
            connectBtn.style.opacity = '0.9';
            
            // 开启传送门图层
            portalDiv.classList.add('portal-active');
            
            // 全屏闪烁光效
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = 0;
            flash.style.left = 0;
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'rgba(0, 255, 255, 0.3)';
            flash.style.zIndex = '999';
            flash.style.pointerEvents = 'none';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 400);
            
            // 额外声音模拟（可选不涉及音频文件，仅视觉震动）
            // 显示转接文本动态
            const portalText = document.querySelector('.portal-text');
            let dotCount = 0;
            const interval = setInterval(() => {
                if(portalDiv.classList.contains('portal-active') && portalText) {
                    dotCount = (dotCount % 3) + 1;
                    portalText.innerHTML = `✦ 接驳超维客服中${'.'.repeat(dotCount)} ✦`;
                } else {
                    clearInterval(interval);
                }
            }, 400);
            
            // 最后跳转，并且保留一点时间让用户感到酷炫
            setTimeout(() => {
                // 极光扫尾效果再跳转
                megaBurstExplosion(window.innerWidth/2, window.innerHeight/2);
                // 最终跳转到人工客服页面
                window.location.href = TARGET_URL;
            }, 1300);
        }
        
        connectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            showPortalAndRedirect();
        });
        
        // 点击背景任意位置关闭彩蛋（隐藏整个页面彩蛋？ 但根据需求：点击背景任意处可关闭彩蛋 → 原来类似上一版本点击overlay隐藏，但新版没有专门overlay但有背景和卡片区，要实现点击非卡片区域关闭“特效/粒子风暴”或者是关闭额外彩蛋？要求“点击背景任意处可关闭彩蛋”，为了体验，我们实现点击背景任意区域（不含按钮和卡片区域）清除所有额外浮动粒子/或者停止爆裂影响？但更像是关闭粒子特效或恢复平静。由于页面中的粒子系统是持续的，关闭彩蛋可理解为：移除所有额外动态爆发元素和闪光，但保留星空，为了尊重原作，我们设定点击背景关闭所有“临时爆破粒子残留”、移除屏幕上的额外闪光+关闭传送门如果开启？
        // 更优雅：监听整个body，如果点击目标不是按钮且不是卡片内部主要交互区，则移除所有炫光浮层、额外创建的小粒子容器（私有megaBurst产生的碎片元素需要清理）
        // 同时为了让用户可以选择关闭爆裂感，实现closeEasterEgg函数
        function closeEasterEgg() {
            // 移除所有爆破产生的小粒子div (以爆炸时样式)
            const allParticles = document.querySelectorAll('body > div:not(.cosmic-bg):not(.hero-container):not(.portal-overlay):not(#starCanvas)');
            allParticles.forEach(el => {
                if(el.style && (el.style.background?.includes('radial-gradient') || (el.style.position === 'fixed' && el.style.zIndex === '99999'))) {
                    el.remove();
                }
            });
            // 如果传送门开着但未跳转 清除传送门
            if(portalDiv.classList.contains('portal-active') && !isConnecting) {
                portalDiv.classList.remove('portal-active');
            }
            // 额外关闭可能残留的toast闪层
            const flashes = document.querySelectorAll('.temp-flash');
            flashes.forEach(f => f.remove());
        }
        
        // 背景点击: 判断事件源
        document.body.addEventListener('click', (e) => {
            // 如果点击的是按钮本身或者按钮内部，不关闭彩蛋（防止干扰转接）
            if(connectBtn.contains(e.target)) return;
            // 如果点击在 vortex-card 区域内，也不关闭（因为是主要卡片）
            const card = document.querySelector('.vortex-card');
            if(card && card.contains(e.target)) return;
            // 如果传送门开启且没有跳转中拦截点击关闭彩蛋的功能? 但是点击背景关闭彩蛋合理，就不会影响转接倒计时，避免误关闭跳转流程? 不中断跳转定时器，仅移除视觉额外元素
            closeEasterEgg();
            // 额外小提示：创建一个简短的提示文字浮层消失
            const tipMsg = document.createElement('div');
            tipMsg.innerText = '✨ 彩蛋已平息 ✨';
            tipMsg.style.position = 'fixed';
            tipMsg.style.bottom = '20%';
            tipMsg.style.left = '50%';
            tipMsg.style.transform = 'translateX(-50%)';
            tipMsg.style.backgroundColor = '#000000aa';
            tipMsg.style.color = '#0ff';
            tipMsg.style.padding = '6px 20px';
            tipMsg.style.borderRadius = '40px';
            tipMsg.style.fontSize = '14px';
            tipMsg.style.zIndex = '100000';
            tipMsg.style.backdropFilter = 'blur(10px)';
            tipMsg.style.fontWeight = 'bold';
            document.body.appendChild(tipMsg);
            setTimeout(() => tipMsg.remove(), 1200);
        });
        
        // 预置一些漂浮粒子美丽收尾
        setInterval(() => {
            if(Math.random() < 0.4) {
                // 产生少量环境飘浮粒子增加震撼感
                for(let i=0;i<3;i++) {
                    const d = document.createElement('div');
                    d.style.position = 'fixed';
                    d.style.left = Math.random() * window.innerWidth + 'px';
                    d.style.top = Math.random() * window.innerHeight + 'px';
                    d.style.width = '3px';
                    d.style.height = '3px';
                    d.style.background = 'cyan';
                    d.style.borderRadius = '50%';
                    d.style.filter = 'blur(1px)';
                    d.style.opacity = '0.6';
                    d.style.pointerEvents = 'none';
                    d.style.zIndex = '999';
                    document.body.appendChild(d);
                    setTimeout(() => d.remove(), 800);
                }
            }
        }, 1200);
        
    })();
</script>
</body>
</html>
